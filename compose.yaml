name: spar
services:
  kafka-volume-init:
    image: apache/kafka:3.9.1
    user: '0:0'
    entrypoint: [/bin/sh, -c]
    command: ['chown 1000:1000 /tmp/kraft-combined-logs']
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
  kafka:
    image: apache/kafka:3.9.1
    depends_on:
      kafka-volume-init: {condition: service_completed_successfully}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 15
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: {condition: service_healthy}
    command: /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic mastodon_stream --partitions 2 --replication-factor 1
  postgres:
    image: postgres:16.9
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mastodon}
      POSTGRES_USER: ${POSTGRES_USER:-mastodon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
  spark:
    build: .
    environment: &app-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: mastodon_stream
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-mastodon}
      PGUSER: ${POSTGRES_USER:-mastodon}
      PGPASSWORD: ${POSTGRES_PASSWORD:-local_demo_change_me}
      KEYWORDS: ${KEYWORDS-AI,DataScience}
      LANGUAGES: ${LANGUAGES-fr,en}
      MASTODON_API_BASE_URL: ${MASTODON_API_BASE_URL:-https://mastodon.social}
      MASTODON_ACCESS_TOKEN: ${MASTODON_ACCESS_TOKEN:-}
      MASTODON_HASHTAGS: ${MASTODON_HASHTAGS-music,photography,art,nature,gaming,travel,football,books}
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    ports: ['127.0.0.1:4040:4040']
    volumes:
      - checkpoints:/checkpoints
    command: /opt/spark/bin/spark-submit --master local[2] --conf spark.jars.ivy=/tmp/ivy --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.6 /app/src/streaming.py
  producer:
    build: .
    profiles: [live]
    environment: *app-env
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    command: python3 -m src.producer
  demo:
    build: .
    profiles: [demo]
    environment: *app-env
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    command: python3 -m src.producer --demo

  jupyter:
    build: .
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    ports:
      - '8888:8888'
      - '4041:4040'
    volumes:
      - .:/app
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''

volumes:
  kafka_data:
  postgres_data:
  checkpoints:
